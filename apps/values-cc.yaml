hdfs:
  # Host a ~20GB dataset with redundancy. Replication 2 across 3 datanodes:
  #   usable ~= 3 x 20Gi / 2 = ~30GB raw-equivalent (comfortable headroom for
  #   20GB), and the cluster survives the loss of one datanode.
  dfsReplication: 2
  dataNode:
    replicas: 3
    storageCapacity: "20Gi"
  # Metadata roles need little disk; size them small instead of inheriting
  # the (large) datanode capacity.
  nameNode:
    storageCapacity: "5Gi"
  # 3 journalnodes form a quorum so the namenode-HA edits journal is no
  # longer a single point of failure (tolerates 1 journalnode down).
  journalNode:
    replicas: 3
    storageCapacity: "2Gi"

# storage defaults to hdfs (see apps/values.yaml) -> in-cluster HDFS stack.
components:
  kafka: true           # Local kafka for fink distribution output
  alertSimulator: false # Production: no alert simulator

finkBroker:
  logLevel: "DEBUG"
  e2e:
    enabled: false 
  image:
    # repository defaults to the fink-broker chart value
    # (gitlab-registry.in2p3.fr/astrolabsoftware/fink)
    name: "fink-broker-noscience"
    # tag is set dynamically at deploy time via: argocd app set fink -p finkBroker.image.tag=<tag>
  stream2raw:
    kafkaInSockets: "public.alerts.ztf.uw.edu:9092"
    finkAlertSchema: "/home/fink/fink-alert-schemas/ztf/template_schema_ZTF_3p3.avro"
    topic: 'ztf_{{.Values.finkBroker.night}}.*'
