hdfs:
  storageCapacity: "20Gi"

# storage defaults to hdfs (see apps/values.yaml) -> in-cluster HDFS stack.
components:
  kafka: true           # Local kafka for fink distribution output
  alertSimulator: false # Production: no alert simulator

finkBroker:
  night: "20260526"
  logLevel: "INFO"
  e2e:
    enabled: false
  image:
    # repository defaults to the fink-broker chart value
    # (gitlab-registry.in2p3.fr/astrolabsoftware/fink)
    name: "fink-broker-noscience"
    # tag is set dynamically at deploy time via: argocd app set fink -p finkBroker.image.tag=<tag>
  stream2raw:
    kafkaInSockets: "public.alerts.ztf.uw.edu:9092"
    finkAlertSchema: "/home/fink/fink-alert-schemas/ztf/template_schema_ZTF_3p3.avro"
    topic: 'ztf_{{.Values.finkBroker.night}}.*'
