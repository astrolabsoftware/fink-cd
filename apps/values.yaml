finkBroker:
  # Default night of the fink-broker WorkflowTemplate (CI), run with
  # fink-broker e2e/catchup.sh. Not set next to a nightly run.
  night: "20200101"
  # Seconds between two micro-batches of the streaming jobs (-tinterval).
  # Empty -> fink-broker chart default (2).
  tinterval: ""
  # Nightly run, forwarded to the fink-broker chart: a CronWorkflow submitting
  # its WorkflowTemplate every day on today's night. Disabled by default (CI):
  # each night is submitted by hand, as any catch-up. The values-scheduled.yaml
  # overlay enables it for the permanent run at CC.
  #
  # Every time in this block is UTC, never local time, so nothing drifts twice
  # a year.
  nightly:
    enabled: false
    # Production timetable (scheduler/README.md in fink-broker), in UTC: the
    # run starts just after the UTC night rollover and processes the live
    # night as its alerts arrive.
    schedule: "1 0 * * *"
    # Time of day (HH:MM, UTC) at which the run stops, on the day of its
    # night. Declared next to schedule so both bounds of the run window are
    # visible.
    #
    # Most ZTF nights are complete by 20:00 UTC; the alerts arriving later
    # (~3%) are recovered by a catch-up of the night.
    exitAt: "20:00"
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
  logLevel: "DEBUG"
  e2e:
    enabled: true
  monitoring:
    enabled: false
  # Daily CronJob printing what entered and what left the broker for each
  # observing night (finkctl get balance). Only meaningful with
  # nightly.enabled and storage=hdfs.
  report:
    enabled: false
    # UTC. Half an hour after nightly.exitAt, once the three jobs of the
    # nightly run have stopped. CI overrides it to fire immediately, since a run
    # lasts minutes, not a day.
    schedule: "30 20 * * *"
    image:
      # Empty -> fink-broker chart default
      tag: ""
  # Image repository/name default to the fink-broker chart values.
  # Override here only when needed (e.g. name for the noscience variant).
  # In CI, repository/tag are injected via `argocd app set -p`.
  image:
    tag: ""
  # cores/coreRequest/memory/instances: empty -> fink-broker chart default
  # (which itself defaults to the global cores/coreRequest/instances/memory).
  stream2raw:
    kafkaInSockets: ""
    finkAlertSchema: ""
    # {night} is resolved by the job from its own night, not frozen here: a
    # night run through the WorkflowTemplate reads the topic of that night.
    topic: 'ztf_public_{night}'
    cores: ""
    coreRequest: ""
    memory: ""
    instances: ""
  # raw2science driver and executor are sized/placed independently (the executor
  # can be pinned to a dedicated node pool). Configured per environment in
  # values-cc.yaml / values-ci-science.yaml; empty here -> fink-broker chart
  # defaults.
  raw2science:
    driver: {}
    executor: {}
  distribution:
    cores: ""
    coreRequest: ""
    memory: ""
    instances: ""
finkAlertSimulator:
  image:
    tag: ""
storage: "hdfs"
s3:
  bucket: fink-broker-online
  endpoint: https://minio.minio:443
kafka:
  storageSize: "1Gi"
  # No SCRAM credentials here: they are provisioned out of band before the
  # deployment, see charts/kafka/values.yaml.
hdfs:
  # false -> Stackable HDFS deployed in the cluster (operators + charts/hdfs),
  #          sized by the knobs below.
  # true  -> an HDFS outside the cluster: no operator nor HDFS cluster is
  #          deployed, and the fink-broker chart skips the user directory
  #          init, which needs the in-cluster namenode.
  # Either way the jobs write under onlineDataPrefix.
  external: false
  # In-cluster HDFS robustness/capacity knobs. Empty -> charts/hdfs default
  # (single datanode, repl 1, operator-default disk per role).
  dfsReplication: ""
  nameNode:
    replicas: ""
    memoryLimit: ""
    storageCapacity: ""
  dataNode:
    replicas: ""
    memoryLimit: ""
    storageCapacity: ""
  journalNode:
    replicas: ""
    memoryLimit: ""
    storageCapacity: ""
  onlineDataPrefix: "hdfs://simple-hdfs-namenode-default-0.simple-hdfs-namenode-default.hdfs:8020///user/185"
  # Replication of the files the Spark jobs write: HDFS clients do not inherit
  # it from the cluster. Empty -> the Hadoop client default (3).
  replication: ""
  # /etc/hosts entries of the Spark and report pods, for HDFS hosts the cluster
  # DNS does not resolve: a list of {ip, hostnames}. Site-specific: never set
  # it in git, pass it with `e2e/argocd.sh -l <local values file>`.
  hostAliases: []
  # NameNode RPC addresses the balance report reads HDFS from. Both namenodes
  # of the in-cluster HA pair (charts/hdfs nameNode.replicas: 2), so the report
  # follows whichever is active.
  namenodes:
    - simple-hdfs-namenode-default-0.simple-hdfs-namenode-default.hdfs:8020
    - simple-hdfs-namenode-default-1.simple-hdfs-namenode-default.hdfs:8020
  stackable:
    operators:
      - zookeeper
      - hdfs
      - commons
      - secret
      - listener
# The storage backend (HDFS or MinIO) is selected by `storage` above:
# storage=hdfs deploys the Stackable HDFS stack unless hdfs.external is set,
# storage=s3 deploys the MinIO operator + tenant. `components` only toggles the
# optional add-ons.
components:
  kafka: true
  alertSimulator: true
  # Argo Workflows controller, running the fink-broker WorkflowTemplate that
  # catches a closed night up
  argoWorkflows: true
spec:
  destination:
    server: https://kubernetes.default.svc
  sparkNamespace: fink-broker
  source:
    repoURL: https://github.com/astrolabsoftware/fink-cd
    targetRevision:
      default: nil
      # Revision for the fink-alert-simulator chart
      finkalertsimulator: nil
      # Revision for the fink-broker chart
      finkbroker: nil
