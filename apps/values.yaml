finkBroker:
  night: "20200101"
  logLevel: "DEBUG"
  e2e:
    enabled: true
  monitoring:
    enabled: false
  # Image repository/name default to the fink-broker chart values.
  # Override here only when needed (e.g. name for the noscience variant).
  # In CI, repository/tag are injected via `argocd app set -p`.
  image:
    tag: ""
  stream2raw:
    kafkaInSockets: ""
    finkAlertSchema: ""
    topic: 'ztf_public_{{.Values.finkBroker.night}}'
    # Executor/driver memory for stream2raw. Empty -> fink-broker chart default.
    memory: ""
  raw2science:
    cores: ""
    coreRequest: ""
    memory: ""
    instances: ""
  distribution:
    memory: ""
finkAlertSimulator:
  image:
    tag: ""
storage: "hdfs"
s3:
  bucket: fink-broker-online
  endpoint: https://minio.minio:443
kafka:
  storageSize: "1Gi"
hdfs:
  # HDFS robustness/capacity knobs. Empty -> charts/hdfs default
  # (single datanode, repl 1, operator-default disk per role).
  dfsReplication: ""
  nameNode:
    replicas: ""
    memoryLimit: ""
    storageCapacity: ""
  dataNode:
    replicas: ""
    memoryLimit: ""
    storageCapacity: ""
  journalNode:
    replicas: ""
    memoryLimit: ""
    storageCapacity: ""
  onlineDataPrefix: "hdfs://simple-hdfs-namenode-default-0.simple-hdfs-namenode-default.hdfs:8020///user/185"
  stackable:
    operators:
      - zookeeper
      - hdfs
      - commons
      - secret
      - listener
# The storage backend (in-cluster HDFS or MinIO) is selected by `storage`
# above: storage=hdfs deploys the Stackable HDFS stack, storage=s3 deploys
# the MinIO operator + tenant. `components` only toggles the optional add-ons.
components:
  kafka: true
  alertSimulator: true
spec:
  destination:
    server: https://kubernetes.default.svc
  sparkNamespace: spark
  source:
    repoURL: https://github.com/astrolabsoftware/fink-cd
    targetRevision:
      default: nil
      # Revision for the fink-alert-simulator chart
      finkalertsimulator: nil
      # Revision for the fink-broker chart
      finkbroker: nil
