apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spark-operator
  namespace: argocd
  annotations:
    # Operators install CRDs and must be healthy before storage CRs (wave 1)
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: spark-operator
    app.kubernetes.io/part-of: fink
    app.kubernetes.io/component: operator
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /status/terminatingReplicas
  source:
    chart: spark-operator
    repoURL: https://kubeflow.github.io/spark-operator
    targetRevision: 2.5.0
    helm:
      releaseName: spark-operator
      valuesObject:
        webhook:
          enable: true
        spark:
          jobNamespaces: ["{{.Values.spec.sparkNamespace}}"]
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: spark-operator
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # See https://github.com/argoproj/argo-cd/issues/820 and https://github.com/argoproj/argo-cd/issues/13100
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
