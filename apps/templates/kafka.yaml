{{ if .Values.components.kafka }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  annotations:
    # Storage CRs depend on operator CRDs (wave 0) and gate the broker (wave 2)
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: fink
    app.kubernetes.io/component: storage
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: kafka
  project: default
  source:
    path: charts/kafka
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision.default }}
    helm:
      valuesObject:
        storageSize: "{{ .Values.kafka.storageSize }}"
        jaas:
          create: {{ .Values.kafka.jaas.create }}
          sparkNamespace: "{{ .Values.spec.sparkNamespace }}"
          {{- if .Values.kafka.jaas.create }}
          password: "{{ .Values.kafka.jaas.password }}"
          {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
{{ end }}
