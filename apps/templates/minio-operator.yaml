{{ if and .Values.components.minio (eq .Values.storage "s3") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-operator
  namespace: argocd
  annotations:
    # Operators install CRDs and must be healthy before storage CRs (wave 1)
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: minio-operator
    app.kubernetes.io/part-of: fink
    app.kubernetes.io/component: operator
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: operator
    repoURL: https://operator.min.io/
    targetRevision: 5.0.10
    helm:
      releaseName: minio-operator
  destination:
    server: "https://kubernetes.default.svc"
    namespace: minio-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
{{ end }}
