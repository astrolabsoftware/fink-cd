{{ if .Values.components.kafka }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  annotations:
    # Operators install CRDs and must be healthy before storage CRs (wave 1)
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: strimzi
    app.kubernetes.io/part-of: fink
    app.kubernetes.io/component: operator
spec:
  project: default
  source:
    chart: strimzi-kafka-operator
    repoURL: quay.io/strimzi-helm
    targetRevision: 0.51.0
    helm:
      releaseName: strimzi
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
{{ end }}
