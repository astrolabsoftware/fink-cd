# Namespace of the Stackable operators, including the listener and secret
# operators whose CSI drivers serve the HDFS volumes. Regular resource with an
# early sync-wave: as a PreSync hook it was deleted and recreated on every sync
# of the app-of-apps, taking every Stackable operator down with it.
apiVersion: v1
kind: Namespace
metadata:
  name: stackable-operators
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Secret
metadata:
  name: stackable-oci-repo
  namespace: argocd
  annotations:
    # Before the Stackable operator Applications (wave 0) pull their charts
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: stackable-charts
  url: oci://oci.stackable.tech/sdp-charts
  type: helm
  enableOCI: "true"
