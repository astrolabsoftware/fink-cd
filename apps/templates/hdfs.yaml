{{ if eq .Values.storage "hdfs" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hdfs
  namespace: argocd
  annotations:
    # Storage CRs depend on operator CRDs (wave 0) and gate the broker (wave 2)
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: hdfs
    app.kubernetes.io/part-of: fink
    app.kubernetes.io/component: storage
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: hdfs
  project: default
  source:
    path: charts/hdfs
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision.default }}
    helm:
      valuesObject:
        storageCapacity: "{{ .Values.hdfs.storageCapacity }}"
        {{- if .Values.hdfs.dfsReplication }}
        dfsReplication: {{ .Values.hdfs.dfsReplication }}
        {{- end }}
        {{- if or .Values.hdfs.dataNode.replicas .Values.hdfs.dataNode.memoryLimit }}
        dataNode:
          {{- if .Values.hdfs.dataNode.replicas }}
          replicas: {{ .Values.hdfs.dataNode.replicas }}
          {{- end }}
          {{- if .Values.hdfs.dataNode.memoryLimit }}
          memoryLimit: "{{ .Values.hdfs.dataNode.memoryLimit }}"
          {{- end }}
        {{- end }}
        {{- if .Values.hdfs.nameNode.memoryLimit }}
        nameNode:
          memoryLimit: "{{ .Values.hdfs.nameNode.memoryLimit }}"
        {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
{{ end }}
