{{ if .Values.components.alertSimulator }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fink-alert-simulator
  namespace: argocd
  annotations:
    # Application layer, deployed after storage (wave 1)
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: fink-alert-simulator
    app.kubernetes.io/component: simulator
    app.kubernetes.io/part-of: fink
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    path: chart/
    repoURL: https://github.com/astrolabsoftware/fink-alert-simulator.git
    targetRevision: "{{ .Values.spec.source.targetRevision.finkalertsimulator }}"
    helm:
      releaseName: fink-alert-simulator
      {{- if .Values.finkAlertSimulator.image.tag }}
      valuesObject:
        image:
          tag: "{{ .Values.finkAlertSimulator.image.tag }}"
      {{- end }}
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: {{ .Values.spec.sparkNamespace }}
  # Auto-synced like the rest of the stack (see fink-broker.yaml).
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
{{ end }}
