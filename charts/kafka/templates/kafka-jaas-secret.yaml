{{- if .Values.jaas.create }}
# Kafka SASL/SCRAM credentials, distributed to the Spark namespace so the
# broker's distribution SparkApplication can authenticate against the local
# Kafka. Replaces the imperative `finkctl createsecrets` step.
#
# The password is *provided to* Strimzi (KafkaUser references the secret below)
# rather than generated by it. That inversion is what makes the derived JAAS
# secret renderable at template time: both secrets are plain Argo CD resources,
# reconciled and self-healed like any other, with no hook Job and no
# cross-namespace RBAC.
#
# These secrets live in the kafka chart so they are only deployed when a local
# Kafka is (the whole app is gated by components.kafka in the app-of-apps).
#
# Set jaas.create=false to reference secrets provisioned out of band (e.g.
# sealed secrets) instead; the chart then creates neither, and both
# `{{ .Values.jaas.passwordSecret.name }}` (this namespace) and
# `fink-kafka-jaas` (the Spark namespace) must already exist.
{{- $password := required "jaas.password is required when jaas.create is true (set kafka.jaas.password in the app-of-apps values)" .Values.jaas.password }}
---
# SCRAM password consumed by the KafkaUser (see kafka-user.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.jaas.passwordSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: fink
type: Opaque
stringData:
  {{ .Values.jaas.passwordSecret.key }}: {{ $password | quote }}
---
# JAAS config mounted by the distribution SparkApplication at
# /etc/fink-broker/kafka-jaas.conf (see the fink-broker chart).
apiVersion: v1
kind: Secret
metadata:
  name: fink-kafka-jaas
  namespace: {{ .Values.jaas.sparkNamespace }}
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: fink
type: Opaque
stringData:
  kafka-jaas.conf: |
    // Configuration for secure kafka authentication
    KafkaClient {
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="{{ .Values.jaas.username }}"
        password="{{ $password }}";
    };
{{- end }}
