apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: fink-producer
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: fink
    strimzi.io/cluster: "kafka-cluster"
spec:
  authentication:
    type: scram-sha-512
    # Consume a password we own instead of letting Strimzi generate one, so the
    # derived JAAS secret can be rendered declaratively (kafka-jaas-secret.yaml).
    password:
      valueFrom:
        secretKeyRef:
          name: {{ .Values.jaas.passwordSecret.name }}
          key: {{ .Values.jaas.passwordSecret.key }}