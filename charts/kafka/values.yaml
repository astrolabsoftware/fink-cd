# Storage size for Kafka persistent volumes.
storageSize: "1Gi"

# Kafka SASL/JAAS credentials, distributed to the Spark namespace for the
# broker's distribution SparkApplication. Both secrets are declarative Argo CD
# resources, which replaces the imperative `finkctl createsecrets` step.
jaas:
  # Render the password and JAAS secrets from .password below. Set to false to
  # provision them out of band instead (e.g. sealed secrets), in which case both
  # .passwordSecret.name (this namespace) and fink-kafka-jaas (the Spark
  # namespace, key kafka-jaas.conf) must already exist.
  create: true
  # Namespace where the broker (distribution SparkApplication) runs and the
  # fink-kafka-jaas secret is created. Wired from spec.sparkNamespace by the
  # app-of-apps.
  sparkNamespace: spark
  # Kafka username written into the JAAS config. Must match the KafkaUser name.
  username: fink-producer
  # SCRAM password for that user. Provided to Strimzi (rather than generated by
  # it) so the JAAS config can be rendered at template time. No default: it is
  # required whenever create is true, and set per environment by the app-of-apps
  # (kafka.jaas.password).
  password: ""
  # Secret holding the password for the KafkaUser to consume.
  passwordSecret:
    name: fink-producer-password
    key: password
