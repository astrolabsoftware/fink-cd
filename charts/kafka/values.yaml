# Storage size for Kafka persistent volumes.
storageSize: "1Gi"

# SASL/SCRAM password of the fink-producer KafkaUser. It is supplied to Strimzi
# rather than generated by it, so the same value can be handed to the broker's
# distribution SparkApplication as a JAAS config.
#
# Two secrets must exist before this chart is deployed, and are never stored in
# git: .passwordSecret.name in this namespace, and fink-kafka-jaas (key
# kafka-jaas.conf) in the Spark namespace. fink-broker e2e/argocd.sh creates
# both on every infra. If they are missing, the KafkaUser stays NotReady and
# the distribution executors stay in ContainerCreating.
jaas:
  # Secret holding the password for the KafkaUser to consume.
  passwordSecret:
    name: fink-producer-password
    key: password
