# Storage size for Kafka persistent volumes.
storageSize: "1Gi"

# Kafka SASL/SCRAM credentials for the fink-producer KafkaUser. The password is
# provided to Strimzi rather than generated by it, so the same value can also be
# handed to the broker's distribution SparkApplication as a JAAS config.
#
# Both secrets are provisioned out of band, before this chart is deployed, and
# must already exist: .passwordSecret.name in this namespace, and
# fink-kafka-jaas (key kafka-jaas.conf) in the Spark namespace. fink-broker
# e2e/argocd.sh creates them for every infra -- keeping them out of git is what
# lets a real cluster run on a real password. Deploy this chart by hand and you
# provision them by hand too; if they are missing, the KafkaUser stays NotReady
# and the distribution executors stay in ContainerCreating.
jaas:
  # Secret holding the password for the KafkaUser to consume.
  passwordSecret:
    name: fink-producer-password
    key: password
